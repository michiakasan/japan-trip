<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Japan Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky filter bar on top, a grid of place cards, a bottom sheet for details. Ocean ink, sand paper, hibiscus accent. */
:root {
  --ink: #12323b;
  --muted: #5d7177;
  --paper: #f6f3ec;
  --card: #ffffff;
  --line: #e2ddd1;
  --accent: #d6455d;
  --sea: #1c8a99;
  --good: #2f8f5b;
  --warn: #b7791f;
  --cold: #3d6fb6;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6efef; --muted: #9db1b4; --paper: #0f1d21; --card: #172a30; --line: #27414a;
    --accent: #f06c82; --sea: #4fc0cf; --good: #5cc48a; --warn: #e2a64b; --cold: #7ea6e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e6efef; --muted: #9db1b4; --paper: #0f1d21; --card: #172a30; --line: #27414a;
  --accent: #f06c82; --sea: #4fc0cf; --good: #5cc48a; --warn: #e2a64b; --cold: #7ea6e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
h1 { font-family: var(--font-display); font-size: 26px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.stat b { font-weight: 700; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 8px; }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px; flex: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--sea); background: var(--sea); color: #fff; }
#q { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }

main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; }
.cover { position: relative; aspect-ratio: 16 / 9; background: var(--line); }
.cover img, .cover canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; top: 8px; left: 8px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.92); color: #12323b; }
.badge.want { background: var(--accent); color: #fff; }
.badge.visited { background: var(--good); color: #fff; }
.gem { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(18,50,59,.78); color: #fff; }
.body { padding: 10px 12px 12px; display: grid; gap: 4px; }
.name { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.jp { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 4px; }
.meta { color: var(--muted); font-size: 13px; }
.temps { display: flex; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.pill { display: inline-block; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; border: 1px solid currentColor; }
.s-good { color: var(--good); } .s-ok { color: var(--sea); } .s-wet { color: var(--warn); } .s-cold { color: var(--cold); } .s-city { color: var(--muted); }
.see { font-size: 13px; color: var(--ink); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.tags span { font-size: 11px; color: var(--muted); background: var(--paper); border-radius: 6px; padding: 1px 6px; }
select.chip { appearance: auto; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
.sheet-bg.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; z-index: 21; transform: translateY(105%); transition: transform .25s ease; max-width: 760px; margin: 0 auto; }
.sheet.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.sheet .cover { aspect-ratio: 16 / 8; }
.close { position: absolute; top: 10px; right: 10px; border: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); color: #12323b; font-size: 18px; line-height: 1; z-index: 2; }
.sheet-in { padding: 14px 16px 30px; display: grid; gap: 14px; }
.sheet h2 { font-family: var(--font-display); margin: 0; font-size: 22px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn.on-want { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on-visited { background: var(--good); border-color: var(--good); color: #fff; }
.btn.link { text-decoration: none; display: inline-block; }
.months { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .months { grid-template-columns: 1fr; } }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.box h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.box p { margin: 0; }
.nums { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-size: 14px; margin-bottom: 4px; flex-wrap: wrap; }
.years { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.year { border: 1px solid var(--good); color: var(--good); border-radius: 999px; padding: 2px 10px; font-size: 13px; background: none; }
.add-year { display: flex; gap: 6px; }
.add-year input { width: 90px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
textarea { width: 100%; min-height: 80px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); resize: vertical; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
.photos figure { margin: 0; position: relative; }
.photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
.photos .mini { position: absolute; bottom: 4px; left: 4px; right: 4px; display: flex; gap: 4px; }
.photos .mini button { flex: 1; font-size: 11px; border: 0; border-radius: 6px; padding: 2px 0; background: rgba(255,255,255,.9); color: #12323b; }
.small { font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.fab { position: fixed; right: 16px; bottom: 16px; z-index: 6; border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
form.add { display: grid; gap: 8px; }
form.add input, form.add select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); width: 100%; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 30; display: none; max-width: 90%; }
</style>
</head>
<body>
<header>
  <h1>Our Japan Places</h1>
  <p class="sub">Islands and cities for our trips. Tap a place to mark it, add years, notes and photos.</p>
  <div class="stats" id="stats"></div>
  <p class="note" id="syncNote"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="row">
    <div class="seg" role="group" aria-label="List">
      <button data-list="all" aria-pressed="true">All</button>
      <button data-list="want" aria-pressed="false">Want to go</button>
      <button data-list="visited" aria-pressed="false">Visited</button>
    </div>
    <div class="seg" role="group" aria-label="Month">
      <button data-month="apr" aria-pressed="true">April</button>
      <button data-month="may" aria-pressed="false">May</button>
    </div>
  </div>
  <div class="row" id="types"></div>
  <div class="row" id="feats"></div>
  <input id="q" type="search" placeholder="Search places, e.g. beach, dolphins, onsen" aria-label="Search places">
</div></div>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No places match. Try another filter.</p>
</main>

<button class="fab" id="addBtn">+ Add place</button>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-label="Place details"></section>
<div class="toast" id="toast"></div>

// ---------- automatic cover pictures (drawn per place type) ----------
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  // clouds
  c.fillStyle = "rgba(255,255,255,.85)";

    c.fillStyle = "#fff"; c.beginPath(); c.moveTo(w * .45 - 40, horizon - 120); c.lineTo(w * .45, horizon - 160); c.lineTo(w * .45 + 40, horizon - 120); c.fill();
    c.fillStyle = "#4f8a55"; c.fillRect(0, horizon, w, h - horizon);

  sea.addColorStop(0, deep); sea.addColorStop(1, k === "volcano" ? "#2a7fa8" : "#3fd0d4");
  c.fillStyle = sea; c.fillRect(0, horizon, w, h - horizon);
  c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 2;
  for (let i = 0; i < 12; i++) { const y = horizon + 8 + r() * (h - horizon - 20), x = r() * w; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 15, y - 4, x + 30, y); c.stroke(); }

    c.fillStyle = "rgba(230,230,230,.75)"; for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(w * .49 + i * 12, horizon - 145 - i * 16, 12 + i * 3, 0, 7); c.fill(); }

    c.fillStyle = "#b8a68a"; c.beginPath(); c.moveTo(w * .62, horizon - 70); c.lineTo(w * .7, h * .8); c.lineTo(w * .6, h * .8); c.lineTo(w * .5, horizon + 2); c.fill();
  } else if (k === "jungle" || k === "forest") {

    c.fillStyle = k === "forest" ? "#3f7449" : "#43a05a";
    for (let i = 0; i < 26; i++) { c.beginPath(); c.arc(r() * w, horizon - 20 - r() * 30, 18 + r() * 14, 0, 7); c.fill(); }

    c.fillStyle = "rgba(255,255,255,.6)"; c.beginPath(); c.moveTo(0, h * .8); c.quadraticCurveTo(w * .4, h * .74, w, h * .86); c.lineTo(w, h * .87); c.quadraticCurveTo(w * .4, h * .76, 0, h * .815); c.fill();

function coverHtml(p, s) {

function renderAreas() {
  const types = [["all","All"],["island","Islands"],["city","Cities"],["gem","Hidden gems"],["swim","Swim in April"]];
  $("#types").innerHTML = types.map(([k, l]) => `<button class="chip" data-type="${k}" aria-pressed="${ptype === k}">${l}</button>`).join("") +
    `<select id="areaSel" class="chip" aria-label="Area"><option value="">All areas</option>${AREAS.filter(a => a !== "Cities").map(a => `<option ${areaSel === a ? "selected" : ""}>${a}</option>`).join("")}</select>`;
  $("#feats").innerHTML = FEATURES.map(([k, l]) => `<button class="chip" data-feat="${k}" aria-pressed="${feats.has(k)}">${l}</button>`).join("") +
    (feats.size ? `<button class="chip" data-feat="__clear" aria-pressed="false">Clear</button>` : "");
}
function renderStats() {
  const all = places(); let w = 0, v = 0;
  all.forEach(p => { const s = st(p.id).status; if (s === "want") w++; if (s === "visited") v++; });
  $("#stats").innerHTML = `<span class="stat"><b>${all.length}</b> places</span><span class="stat"><b>${w}</b> want to go</span><span class="stat"><b>${v}</b> visited</span>`;
}
function matches(p) {
  const s = st(p.id);
  if (list === "want" && s.status !== "want") return false;
  if (list === "visited" && s.status !== "visited") return false;
  if (ptype === "island" && isCity(p)) return false;
  if (ptype === "city" && !isCity(p)) return false;
  if (ptype === "gem" && !p.gem) return false;
  if (ptype === "swim" && !(p.swim === "good" || p.swim === "ok")) return false;
  if (areaSel && p.area !== areaSel) return false;
  if (feats.size) { const t = tagsOf(p); for (const f of feats) if (!t.includes(f)) return false; }
  if (query) {
    const hay = [p.name, p.jp, p.area, p.desc, p.seeA, p.seeM, s.notes].join(" ").toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}

  renderStats();
  const items = places().filter(matches);
  const grid = $("#grid");
  grid.innerHTML = items.map(p => {
    const s = st(p.id), sw = SWIM[p.swim] || SWIM.city;
    const air = month === "apr" ? p.airA : p.airM, sea = month === "apr" ? p.seaA : p.seaM, see = month === "apr" ? p.seeA : p.seeM;
    const badge = s.status === "want" ? `<span class="badge want">Want to go</span>` : s.status === "visited" ? `<span class="badge visited">Visited${s.years && s.years.length ? " " + esc(s.years.join(", ")) : ""}</span>` : "";
    return `<button class="card" data-open="${esc(p.id)}">
      <div class="cover">${coverHtml(p, s)}${badge}${p.gem ? `<span class="gem">Hidden gem</span>` : ""}</div>
      <div class="body">
        <div class="name">${esc(p.name)}<span class="jp">${esc(p.jp)}</span></div>
        <div class="meta">${esc(p.area)}</div>
        <div class="temps">${air ? `<span>Air ${esc(air)}°C</span>` : ""}${sea ? `<span>Sea ${esc(sea)}°C</span>` : ""}<span class="pill ${sw[1]}">${sw[0]}</span></div>
        <div class="see">${esc(see)}</div>
        <div class="tags">${tagsOf(p).map(k => `<span>${esc((FEATURES.find(f => f[0] === k) || [k, k])[1])}</span>`).join("")}</div>

// ---------- detail sheet ----------
let openId = null;

        <div class="box"><h3>May</h3><div class="nums">${p.airM ? `<span>Air ${esc(p.airM)}°C</span>` : ""}${p.seaM ? `<span>Sea ${esc(p.seaM)}°C</span>` : ""}</div><p>${esc(p.seeM)}</p></div>

// ---------- saving ----------
function saveState(id, next) {
  states[id] = next; render(); renderSheet();
  if (!db || !canWrite) return;
  const body = { status: next.status || "", years: next.years || [], notes: next.notes || "", photos: next.photos || [], cover: next.cover || null, updatedAt: new Date().toISOString() };
  writeChains[id] = (writeChains[id] || Promise.resolve()).then(() => db.doc("places/" + id).set(body)).catch(e => {
    if (e && e.code === "invalid_argument") { canWrite = false; toast("You can view this page but not save changes."); }
    else toast("Couldn't save. Check your connection and try again.");
  });
}
function setStatus(id, status) {
  const s = { ...st(id) };
  s.status = s.status === status ? "" : status;
  if (s.status === "visited" && !(s.years || []).length) s.years = [String(new Date().getFullYear())];
  saveState(id, s);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.list) { list = t.dataset.list; document.querySelectorAll("[data-list]").forEach(b => b.setAttribute("aria-pressed", b === t)); render(); }
  else if (t.dataset.month) { month = t.dataset.month; document.querySelectorAll("[data-month]").forEach(b => b.setAttribute("aria-pressed", b === t)); render(); }
  else if (t.dataset.type) { ptype = t.dataset.type; renderAreas(); render(); }
  else if (t.dataset.feat) { const f = t.dataset.feat; if (f === "__clear") feats.clear(); else if (feats.has(f)) feats.delete(f); else feats.add(f); renderAreas(); render(); }
  else if (t.dataset.open) openSheet(t.dataset.open);
  else if (t.id === "closeBtn") closeSheet();
  else if (t.id === "addBtn") { openSheet("__add"); }
  else if (t.dataset.status) setStatus(openId, t.dataset.status);
  else if (t.dataset.yearDel) { const s = { ...st(openId) }; s.years = (s.years || []).filter(y => y !== t.dataset.yearDel); saveState(openId, s); }
  else if (t.dataset.coverSet) { const s = { ...st(openId) }; s.cover = s.cover === t.dataset.coverSet ? null : t.dataset.coverSet; saveState(openId, s); }
  else if (t.dataset.photoDel) { removePhoto(openId, t.dataset.photoDel); }
  else if (t.id === "delPlace") { deletePlace(openId); }
});
$("#sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("change", e => { if (e.target.id === "areaSel") { areaSel = e.target.value; render(); } });
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "yearForm") {
    const y = $("#yearIn").value.trim();
    if (!/^\d{4}$/.test(y)) { toast("Enter a year like 2027."); return; }
    const s = { ...st(openId) }; s.years = Array.from(new Set([...(s.years || []), y])).sort();
    if (!s.status) s.status = "visited";
    saveState(openId, s);
  } else if (e.target.id === "addForm") addPlace();
});
document.addEventListener("focusout", e => {
  if (e.target.id === "notes" && openId) { const v = e.target.value; if (v !== (st(openId).notes || "")) { const s = { ...st(openId) }; s.notes = v; states[openId] = s; saveState(openId, s); } }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "photoIn" || !assets) return;
  const files = Array.from(e.target.files || []); const id = openId; if (!files.length) return;
  toast("Uploading " + files.length + " photo" + (files.length > 1 ? "s" : "") + "...");
  const added = [];
  for (const f of files) {
    try { const blob = await shrink(f); const r = await assets.upload(blob, { type: "image/jpeg" }); added.push(r.id); }
    catch (err) { toast(err && err.code === "too_large" ? "One photo is too big (max 20 MB)." : err && err.code === "quota_or_state" ? "Photo storage is full." : "A photo couldn't be uploaded."); }
  }
  if (added.length) { const s = { ...st(id) }; s.photos = [...(s.photos || []), ...added]; saveState(id, s); toast("Photos added."); }
});
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file); const max = 1600, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", .85));
  } catch { return file; }
}
async function removePhoto(id, assetId) {
  const s = { ...st(id) }; s.photos = (s.photos || []).filter(x => x !== assetId); if (s.cover === assetId) s.cover = null;
  saveState(id, s);
  try { if (assets) await assets.delete(assetId); } catch {}
}
async function addPlace() {
  const name = $("#fName").value.trim(); if (!name) return;
  const id = "c-" + Date.now().toString(36);
  const p = { id, custom: true, name, jp: $("#fJp").value.trim(), area: $("#fArea").value, kind: $("#fKind").value, swim: $("#fKind").value === "beach" ? "ok" : "city", airA: "", airM: "", seaA: "", seaM: "", seeA: "", seeM: "", desc: $("#fDesc").value.trim(), gem: false, go: "" };
  custom[id] = p; states[id] = { status: "want", years: [], notes: "", photos: [], cover: null };
  closeSheet(); render(); openSheet(id);
  if (db && canWrite) {
    try { await db.doc("custom/" + id).set(p); } catch { toast("Couldn't save the new place."); }
    saveState(id, states[id]);
  }
}
async function deletePlace(id) {
  delete custom[id]; delete states[id]; closeSheet(); render();
  if (db && canWrite) { try { await db.doc("custom/" + id).delete(); await db.doc("places/" + id).delete(); } catch { toast("Couldn't delete it. Try again."); } }
}

// ---------- start ----------
renderAreas(); render();
(async () => {
  if (!window.claude || !window.claude.use) { $("#syncNote").textContent = "Saving is off in this preview. Open the shared page to save."; return; }
  try {
    const [d, a, u] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("user")]);
    db = d; assets = a;
    if (u && u.can) { try { const w = await u.can("data.write"); if (w === false) canWrite = false; } catch {} }
  } catch {}
  if (!db) { $("#syncNote").textContent = "Saving is off here. Sign in to claude.ai to save your list."; return; }
  if (!canWrite) $("#syncNote").textContent = "You can look, but saving needs edit access to this page.";
  const timer = setTimeout(() => { $("#syncNote").textContent = "Can't reach saved data yet. Changes may not be up to date."; }, 10000);
  const clear = snap => { if (!snap.metadata.fromCache) { clearTimeout(timer); if ($("#syncNote").textContent.startsWith("Can't reach")) $("#syncNote").textContent = ""; } };
  db.collection("places").onSnapshot(snap => {
    clear(snap);
    const next = {}; snap.docs.forEach(d => { const v = d.data() || {}; next[d.id] = { status: v.status || "", years: Array.isArray(v.years) ? v.years.map(String) : [], notes: typeof v.notes === "string" ? v.notes : "", photos: Array.isArray(v.photos) ? v.photos.filter(x => typeof x === "string") : [], cover: typeof v.cover === "string" ? v.cover : null }; });
    const editing = document.activeElement && document.activeElement.id === "notes";
    states = next; render(); if (!editing) renderSheet();
  }, () => { clearTimeout(timer); $("#syncNote").textContent = "Saved data couldn't load. Reload the page to try again."; });
  db.collection("custom").onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { const v = d.data() || {}; if (typeof v.name === "string") next[d.id] = { id: d.id, custom: true, name: v.name, jp: String(v.jp || ""), area: String(v.area || "Other"), kind: String(v.kind || "city"), swim: String(v.swim || "city"), airA: "", airM: "", seaA: "", seaM: "", seeA: "", seeM: "", desc: String(v.desc || ""), gem: false, go: String(v.go || "") }; });
    custom = next; render();
  }, () => {});
})();
</script>
